name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: "false"

jobs:
  # Never publish an artifact that has not passed the same gate as a PR.
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run verify

      # A release tag that disagrees with package.json produces an npm version
      # nobody can correlate back to a commit.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "Version $PKG confirmed."

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance via OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires a recent npm; the runner's bundled version
      # lags behind.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
